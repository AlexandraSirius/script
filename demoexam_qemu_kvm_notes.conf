###############################################################################
# demoexam_qemu_kvm_notes.conf
#
# Linux-style config/cheatsheet for DEMO exam lab in QEMU/KVM.
# Можно открыть в nano/less и использовать как документацию:
#
#   nano demoexam_qemu_kvm_notes.conf
#   less demoexam_qemu_kvm_notes.conf
#
# ВАЖНО:
# - Это НЕ единый исполняемый скрипт.
# - Команды собраны по узлам: ISP, HQ-RTR, BR-RTR, HQ-SRV, BR-SRV, HQ-CLI.
# - Перед копированием команды сверяй имя интерфейса через: ip -br a
# - Пароли оставлены как в лабораторной работе.
###############################################################################


###############################################################################
# 00. УЧЁТКИ И ПАРОЛИ
###############################################################################

# Первый пароль на vESR/Eltex:
#   Admin1234

# Пользователь для роутеров:
#   login:    net_admin
#   password: P@ssw0rd
#   privilege 15

# Для Linux-серверов в командах ниже используется root.


###############################################################################
# 01. АДРЕСНЫЙ ПЛАН
###############################################################################

# ISP-WAN: DHCP
# ISP-HQ: 172.16.1.1/28
# ISP-BR: 172.16.2.1/28

# HQ-RTR -> ISP:    172.16.1.2/28
# HQ-RTR -> HQ-SRV: 192.168.100.1/27
# HQ-RTR -> HQ-CLI: 192.168.200.1/28
# HQ-RTR -> MGMT:   192.168.99.1/29

# BR-RTR -> ISP:    172.16.2.2/28
# BR-RTR -> BR-SRV: 192.168.30.1/28

# HQ-SRV: 192.168.100.2/27, GW 192.168.100.1
# HQ-CLI: DHCP; ожидаемый адрес 192.168.200.3/28, GW 192.168.200.1
# BR-SRV: 192.168.30.2/28, GW 192.168.30.1

# GRE:
# HQ-RTR: 10.10.10.1/30
# BR-RTR: 10.10.10.2/30


###############################################################################
# 02. ИНТЕРФЕЙСЫ В QEMU/KVM
###############################################################################

# В старых инструкциях Proxmox часто были интерфейсы enp7s1/enp7s2/enp7s3.
# В QEMU/KVM чаще всего используются ens3/ens4/ens5.
# Если команда не работает, сначала смотри реальные имена интерфейсов:

ip -br a

# Проверить MAC-адрес конкретного адаптера на Linux-машине:

cat /sys/class/net/ens3/address
cat /sys/class/net/ens11/address 2>/dev/null || true
cat /sys/class/net/ens9/address 2>/dev/null || true

# Типовая схема QEMU/KVM:
#
# ISP:
#   ens3  = WAN/default/DHCP
#   ens4  = ISP-HQ 172.16.1.1/28
#   ens5  = ISP-BR 172.16.2.1/28
#   ens10 = host-mgmt, НЕ ТРОГАТЬ
#
# HQ-SRV:
#   ens3 = 192.168.100.2/27
#
# BR-SRV:
#   ens3 = 192.168.30.2/28
#
# HQ-CLI:
#   ens3 = DHCP или временная статика 192.168.200.3/28


###############################################################################
# 03. БЫСТРЫЕ ПРОВЕРКИ SSH И PING
###############################################################################

# Проверка с ISP или с машины, откуда есть доступ до стенда:

ping -c 3 172.16.1.2
ping -c 3 172.16.2.2
ping -c 3 192.168.100.2
ping -c 3 192.168.30.2
ping -c 3 192.168.200.3

ssh net_admin@172.16.1.2
ssh net_admin@172.16.2.2
ssh root@192.168.100.2
ssh root@192.168.30.2
ssh root@192.168.200.3

# Если SSH впервые спрашивает:
#   Are you sure you want to continue connecting?
# Ввести вручную:
#   yes

# Чтобы SSH не спрашивал yes/no при первом подключении:

ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null net_admin@172.16.1.2
ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null net_admin@172.16.2.2
ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@192.168.100.2


###############################################################################
# 04. ISP: МИНИМАЛЬНАЯ СЕТЕВАЯ НАСТРОЙКА
###############################################################################

# Выполнять на Linux-машине ISP.
# Для QEMU/KVM используются ens3/ens4/ens5.
# Если у тебя другие имена интерфейсов, сначала замени их в командах.

nmcli con mod ISP-WAN ipv4.method auto 2>/dev/null || true
nmcli con add type ethernet ifname ens3 con-name ISP-WAN ipv4.method auto 2>/dev/null || true

nmcli con add type ethernet ifname ens4 con-name ISP-HQ ipv4.addresses 172.16.1.1/28 ipv4.method manual 2>/dev/null || true
nmcli con mod ISP-HQ ipv4.addresses 172.16.1.1/28 ipv4.method manual

nmcli con add type ethernet ifname ens5 con-name ISP-BR ipv4.addresses 172.16.2.1/28 ipv4.method manual 2>/dev/null || true
nmcli con mod ISP-BR ipv4.addresses 172.16.2.1/28 ipv4.method manual

nmcli con up ISP-WAN
nmcli con up ISP-HQ
nmcli con up ISP-BR

sysctl -w net.ipv4.ip_forward=1
echo 'net.ipv4.ip_forward = 1' > /etc/sysctl.d/99-forward.conf

systemctl enable --now sshd

ip -br a
ip route


###############################################################################
# 05. HQ-RTR: МИНИМАЛЬНАЯ НАСТРОЙКА ДЛЯ SSH
###############################################################################

# Выполнять в консоли HQ-RTR.
# Сначала войти с первым паролем:
#   Admin1234

password Admin1234
commit
confirm

configure terminal
hostname hq-rtr.sirius-exam.org

username net_admin
 password P@ssw0rd
 privilege 15
exit

# Линк HQ-RTR <-> ISP.
# По исходной схеме: HQ-RTR -> ISP = 172.16.1.2/28, ISP-HQ = 172.16.1.1/28.

interface gigabitethernet 1/0/2
 ip firewall disable
 ip address 172.16.1.2/28
exit

# HQ-SRV-Net: шлюз для HQ-SRV 192.168.100.2/27.

interface gigabitethernet 1/0/3
 ip firewall disable
 ip address 192.168.100.1/27
exit

# HQ-CLI-Net: шлюз и DHCP-сеть для HQ-CLI.

interface gigabitethernet 1/0/4
 ip firewall disable
 ip address 192.168.200.1/28
exit

# Default route через ISP.

ip route 0.0.0.0/0 172.16.1.1

# Включить SSH на HQ-RTR.

ip ssh server

do commit
do confirm

# Проверка на HQ-RTR:

do ping 8.8.8.8

# Если не работает, проверить с ISP:

ping -c 3 172.16.1.2
ssh net_admin@172.16.1.2


###############################################################################
# 06. BR-RTR: МИНИМАЛЬНАЯ НАСТРОЙКА ДЛЯ SSH
###############################################################################

# Выполнять в консоли BR-RTR.
# Сначала войти с первым паролем:
#   Admin1234

password Admin1234
commit
confirm

configure terminal
hostname br-rtr.sirius-exam.org

username net_admin
 password P@ssw0rd
 privilege 15
exit

# Линк BR-RTR <-> ISP.
# По исходной схеме: BR-RTR -> ISP = 172.16.2.2/28, ISP-BR = 172.16.2.1/28.

interface gigabitethernet 1/0/3
 ip firewall disable
 ip address 172.16.2.2/28
exit

# BR-SRV-Net: шлюз для BR-SRV 192.168.30.2/28.
# В исходной подсказке интерфейс для BR-SRV не был явно указан.
# Если у тебя он известен, добавь блок по образцу:
#
# interface gigabitethernet 1/0/X
#  ip firewall disable
#  ip address 192.168.30.1/28
# exit

ip route 0.0.0.0/0 172.16.2.1
ip ssh server

do commit
do confirm

# Проверка на BR-RTR:

do ping 8.8.8.8

# Если не работает, проверить с ISP:

ping -c 3 172.16.2.2
ssh net_admin@172.16.2.2


###############################################################################
# 07. HQ-SRV: МИНИМАЛЬНАЯ НАСТРОЙКА СЕТИ И SSH
###############################################################################

# Выполнять в консоли HQ-SRV.
# Для QEMU/KVM обычно интерфейс ens3.

nmcli con add type ethernet ifname ens3 con-name HQ-SRV ipv4.addresses 192.168.100.2/27 ipv4.gateway 192.168.100.1 ipv4.method manual 2>/dev/null || true
nmcli con mod HQ-SRV ipv4.addresses 192.168.100.2/27 ipv4.gateway 192.168.100.1 ipv4.method manual
nmcli con up HQ-SRV

ssh-keygen -A
sshd -t
systemctl enable --now sshd
systemctl restart sshd

# Проверка на HQ-SRV:

ip -br a
ip route
ping -c 3 192.168.100.1

# Проверка с ISP:

ping -c 3 192.168.100.2
ssh root@192.168.100.2


###############################################################################
# 08. BR-SRV: МИНИМАЛЬНАЯ НАСТРОЙКА СЕТИ И SSH
###############################################################################

# Выполнять в консоли BR-SRV.
# Для QEMU/KVM обычно интерфейс ens3.

nmcli con add type ethernet ifname ens3 con-name BR-SRV ipv4.addresses 192.168.30.2/28 ipv4.gateway 192.168.30.1 ipv4.method manual 2>/dev/null || true
nmcli con mod BR-SRV ipv4.addresses 192.168.30.2/28 ipv4.gateway 192.168.30.1 ipv4.method manual
nmcli con up BR-SRV

ssh-keygen -A
sshd -t
systemctl enable --now sshd
systemctl restart sshd

# Проверка на BR-SRV:

ip -br a
ip route
ping -c 3 192.168.30.1

# Проверка с ISP:

ping -c 3 192.168.30.2
ssh root@192.168.30.2


###############################################################################
# 09. HQ-CLI: МИНИМАЛЬНАЯ НАСТРОЙКА СЕТИ И SSH
###############################################################################

# Выполнять в консоли HQ-CLI.
# В финальной схеме HQ-CLI должен получать адрес по DHCP.
# Временная статика для первичного доступа: 192.168.200.3/28.

nmcli con add type ethernet ifname ens3 con-name HQ-CLI ipv4.addresses 192.168.200.3/28 ipv4.gateway 192.168.200.1 ipv4.method manual 2>/dev/null || true
nmcli con mod HQ-CLI ipv4.addresses 192.168.200.3/28 ipv4.gateway 192.168.200.1 ipv4.method manual
nmcli con up HQ-CLI

ssh-keygen -A
sshd -t
systemctl enable --now sshd
systemctl restart sshd

# Проверка на HQ-CLI:

ip -br a
ip route
ping -c 3 192.168.200.1

# Проверка с ISP:

ping -c 3 192.168.200.3
ssh root@192.168.200.3


###############################################################################
# 10. ЗАПУСК СКРИПТА ЧЕРЕЗ SCP НА ISP
###############################################################################

# Чтобы не мучиться с длинным именем файла и скобками,
# копируй любой актуальный скрипт на ISP как /root/demoexam.sh.

ls -la /home/reduser/Загрузки/*demoexam*

scp '/home/reduser/Загрузки/IMYA_SKRIPTA.sh' root@10.10.250.11:/root/demoexam.sh && ssh -tt root@10.10.250.11 'cd /root && chmod +x demoexam.sh && bash demoexam.sh'

# Если ошибка:
#   scp: stat local ... No such file or directory
#
# Причина: такого файла нет на KVM-хосте.
# Файл мог быть загружен в чат, но не скачан в /home/reduser/Загрузки.
# Сначала проверь реальное имя файла:

ls -la /home/reduser/Загрузки/*demoexam*
find /home/reduser -iname '*demoexam*' -type f


###############################################################################
# 11. ЕСЛИ net_admin ПИШЕТ Permission denied
###############################################################################

# Если ping до роутера есть, но SSH пишет Permission denied для net_admin,
# проблема не в сети и не в yes/no.
# На Eltex/vESR неправильно создан пользователь или пароль.
# В консоли нужного роутера выполнить:

configure terminal
username net_admin
 password P@ssw0rd
 privilege 15
exit
ip ssh server
do commit
do confirm

# Проверка с ISP:

ssh net_admin@172.16.1.2
ssh net_admin@172.16.2.2


###############################################################################
# 12. ЕСЛИ IP ЕСТЬ, НО DNS НЕ РАБОТАЕТ
###############################################################################

# Признак DNS-проблемы:
# - ping 8.8.8.8 работает
# - ping ya.ru пишет "Неизвестное имя или служба"
# - dnf пишет "Could not resolve host"

# Сначала посмотреть активное подключение:

nmcli con show --active

# Быстрый фикс через NetworkManager.
# Вместо IMYA_PODKLYUCHENIYA подставить реальное имя из nmcli con show --active.

nmcli con mod IMYA_PODKLYUCHENIYA ipv4.dns "77.88.8.8 8.8.8.8" ipv4.ignore-auto-dns yes
nmcli con up IMYA_PODKLYUCHENIYA
systemctl restart systemd-resolved 2>/dev/null || true

getent hosts repo.red-soft.ru
getent hosts ya.ru

# Жёсткий быстрый фикс через /etc/resolv.conf:

rm -f /etc/resolv.conf
cat > /etc/resolv.conf <<'RESOLV_EOF'
nameserver 77.88.8.8
nameserver 8.8.8.8
RESOLV_EOF

getent hosts ya.ru
ping -c 3 ya.ru

# Для HQ-CLI временный DNS-фикс:

nmcli con show --active
nmcli con mod HQ-CLI ipv4.dns "77.88.8.8 8.8.8.8" ipv4.ignore-auto-dns yes
nmcli con up HQ-CLI
getent hosts ya.ru
ping -c 3 ya.ru

# В финальной схеме DNS для HQ-CLI должен прийти от DHCP как 192.168.100.2,
# когда HQ-SRV DNS уже настроен.


###############################################################################
# 13. ЕСЛИ DNF ДОЛГО КАЧАЕТ ИЛИ ЗАВИС
###############################################################################

# Типичная проблема RedOS-репозиториев:
# - большие метаданные
# - медленные зеркала
# - после Ctrl+C остаются старые dnf/rpm процессы и lock-файлы
#
# Главное правило:
# - НЕ запускать несколько dnf одновременно.
# - НЕ делать dnf clean all без необходимости.
# - dnf clean all стирает весь кэш, потом RedOS снова качает метаданные.


###############################################################################
# 13.1. ЖЁСТКО ОСТАНОВИТЬ СТАРЫЕ DNF/RPM ПРОЦЕССЫ
###############################################################################

# Выполнять на той машине, где завис dnf: HQ-SRV, BR-SRV или HQ-CLI.

pkill -9 -f '/usr/bin/dnf' 2>/dev/null || true
pkill -9 -f '/usr/bin/rpm' 2>/dev/null || true
pkill -9 -f 'packagekitd' 2>/dev/null || true
pkill -9 -f 'rpmdb' 2>/dev/null || true

systemctl stop packagekit.service 2>/dev/null || true
systemctl stop dnf-makecache.service 2>/dev/null || true
systemctl stop dnf-makecache.timer 2>/dev/null || true

rm -f /var/cache/dnf/metadata_lock.pid
rm -f /var/cache/dnf/download_lock.pid
rm -f /var/cache/dnf/system-upgrade-download_lock.pid
rm -f /var/lib/dnf/rpmdb_lock.pid
rm -f /run/dnf.pid
rm -f /var/run/dnf.pid
rm -f /var/lib/rpm/.rpm.lock
rm -f /usr/lib/sysimage/rpm/.rpm.lock

# Проверить, что старых процессов больше нет:

ps -eo pid,ppid,stat,etime,cmd | grep -E 'dnf|rpm|packagekit|rpmdb' | grep -v grep

# Если ничего не вывело — хорошо.
# Проверить rpmdb:

rpm -qa >/dev/null && echo "rpmdb OK" || rpm --rebuilddb


###############################################################################
# 13.2. ЕСЛИ НЕ СОВПАДАЮТ МЕТАДАННЫЕ РЕПОЗИТОРИЯ
###############################################################################

# Чистить только metadata, не весь кэш:

dnf clean metadata
dnf makecache --refresh

# Если makecache просто медленно качает, лучше дождаться.
# Для RedOS это может быть долго.


###############################################################################
# 13.3. РУЧНАЯ УСТАНОВКА ПАКЕТОВ ДЛЯ HQ-SRV
###############################################################################

dnf -v install -y \
  --setopt=timeout=120 \
  --setopt=retries=3 \
  --setopt=minrate=1 \
  policycoreutils-python-utils bind nfs-utils nfs4-acl-tools \
  httpd php php-mysqlnd mariadb-server mariadb

# Если установка пошла медленно, но строки появляются — ждать.


###############################################################################
# 13.4. РУЧНАЯ УСТАНОВКА ПАКЕТОВ ДЛЯ BR-SRV
###############################################################################

dnf -v install -y \
  --setopt=timeout=120 \
  --setopt=retries=3 \
  --setopt=minrate=1 \
  policycoreutils-python-utils samba samba-client nginx

# Если дальше скрипт отдельно ставит Docker/Compose и снова упирается в dnf,
# повторить очистку из пункта 13.1 и смотреть лог конкретного шага.


###############################################################################
# 13.5. ЕСЛИ DNF КАК БУДТО ЗАВИС И ЛОГ ПУСТОЙ
###############################################################################

# Проверить процессы:

ps -eo pid,ppid,stat,etime,cmd | grep -E 'dnf|rpm|python3|packagekit' | grep -v grep

# Если есть старый процесс dnf install, который висит долго и ничего не пишет,
# снова выполнить жёсткую очистку из пункта 13.1.

# Полезные логи:

tail -f /tmp/HQ_SRV_PACKAGES_dnf_install.log
tail -f /tmp/BR_SRV_BASE_PACKAGES_dnf_install.log

# Если лог пустой больше минуты, а процесс dnf висит — остановить его через
# команды из пункта 13.1 и запустить установку вручную.


###############################################################################
# 13.6. ПОСЛЕ РУЧНОЙ УСТАНОВКИ ВЕРНУТЬСЯ В СКРИПТ
###############################################################################

# Если скрипт ждёт:
#   [ENTER] Нажми Enter, когда сделал(а) действие выше:
#
# После ручной установки пакетов нажать Enter.
#
# Если в новой версии скрипта появляется вопрос:
#   Повторить? yes/no [no]:
#
# Ввести yes, если надо повторить:
#   yes
#
# Если узел не критичен прямо сейчас и нужно идти дальше:
#   no
# или просто нажать Enter.


###############################################################################
# 14. RAID0: СКРИПТ НАШЁЛ /dev/zram0 ИЛИ /dev/vda
###############################################################################

# Нельзя собирать RAID из zram и системного диска.
# zram — это память.
# vda обычно системный диск с root.
# Для настоящего RAID0 нужны два отдельных дополнительных диска,
# например /dev/vdb и /dev/vdc.

lsblk -o NAME,TYPE,SIZE,FSTYPE,MOUNTPOINTS
findmnt -n -o SOURCE /

# Правильный вариант для RAID:
# - два пустых диска
# - без mountpoint
# - например /dev/vdb и /dev/vdc
#
# Если дополнительных дисков нет, безопаснее пропустить RAID
# и создать обычную директорию:

mkdir -p /raid


###############################################################################
# 15. ЕСЛИ ОДИН УЗЕЛ УПАЛ, А НУЖНО ИДТИ ДАЛЬШЕ
###############################################################################

# В новых версиях скрипта режим такой:
# если шаг упал, можно выбрать no или просто Enter,
# и скрипт перейдёт к следующему устройству.
#
# Для Linux-узлов лучше использовать параллельный режим:
# HQ-SRV, BR-SRV и HQ-CLI настраиваются одновременно.
#
# Ответы:
#   yes / y / да      = повторить шаг
#   no  / n / нет     = пропустить шаг и идти дальше
#   Enter             = пропустить шаг и идти дальше


###############################################################################
# 16. МИНИМАЛЬНАЯ ДИАГНОСТИКА ПО УЗЛАМ
###############################################################################

# Если непонятно, где проблема, сначала проверить по цепочке.


###############################################################################
# 16.1. ISP
###############################################################################

ip -br a
ip route
ping -c 3 172.16.1.2
ping -c 3 172.16.2.2


###############################################################################
# 16.2. HQ-SRV
###############################################################################

ip -br a
ip route
cat /etc/resolv.conf
ping -c 3 192.168.100.1
ping -c 3 8.8.8.8
getent hosts repo.red-soft.ru


###############################################################################
# 16.3. BR-SRV
###############################################################################

ip -br a
ip route
cat /etc/resolv.conf
ping -c 3 192.168.30.1
ping -c 3 8.8.8.8
getent hosts repo.red-soft.ru


###############################################################################
# 16.4. HQ-CLI
###############################################################################

ip -br a
ip route
cat /etc/resolv.conf
ping -c 3 192.168.200.1
ping -c 3 8.8.8.8
getent hosts ya.ru


###############################################################################
# 17. ФИНАЛЬНЫЕ ПРОВЕРКИ
###############################################################################

# Выполнять на ISP.

ping -c 3 172.16.1.2
ping -c 3 172.16.2.2
ping -c 3 192.168.100.2
ping -c 3 192.168.30.2
ping -c 3 192.168.200.3

# SSH:

ssh net_admin@172.16.1.2
ssh net_admin@172.16.2.2
ssh root@192.168.100.2
ssh root@192.168.30.2
ssh root@192.168.200.3

# WEB:

curl -s http://192.168.30.2:8080
curl -s http://172.16.2.2:8080
curl -s http://172.16.1.2:8080
curl -s -u WEB:'P@ssw0rd' http://web.sirius-exam.org
curl -s http://docker.sirius-exam.org
curl -k -I https://192.168.30.2 | grep -i Strict-Transport-Security

# DNS:

dig @192.168.100.2 hq-srv.sirius-exam.org
dig @192.168.100.2 br-srv.sirius-exam.org
