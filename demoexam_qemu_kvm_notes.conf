# Пример клонирования документации RedOS:

git clone https://github.com/redos-doc/redos-doc

# Читать файл в less:

less <file>.md

# Навигация в less:
# - стрелочки / PageUp / PageDown — перемещение
# - /слово                    — поиск
# - n                         — следующее совпадение
# - q                         — выход

# Очистка истории команд может не сработать в некоторых окружениях:

history -c


